name: Build Windows Portable EXE

on:
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'desktop/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências (pywebview e pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: Compilar GeradorSenhaMAC.exe
        working-directory: desktop
        run: |
          $args = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name", "GeradorSenhaMAC",
            "--add-data", "index.html;.",
            "--add-data", "..\app.js;."
          )
          if (Test-Path "favicon.ico") {
            $args += "--icon=favicon.ico"
          } elseif (Test-Path "..\favicon.ico") {
            $args += "--icon=..\favicon.ico"
          }
          pyinstaller @args main.py

      - name: Disponibilizar .exe como Artifact do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: GeradorSenhaMAC-Windows
          path: desktop/dist/GeradorSenhaMAC.exe
          retention-days: 30

      - name: Publicar .exe na Release Permanente (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Versão Windows Portátil (Última Compilação)
          body: "Executável portátil 100% offline para Windows 10/11. Atualizado automaticamente a cada nova versão."
          files: desktop/dist/GeradorSenhaMAC.exe
          make_latest: true